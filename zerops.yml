zerops:
  - setup: bvoo
    build:
      base: python@3.12
      buildCommands:
        - pip install --no-cache-dir -r requirements.txt
      deployFiles:
        - ./
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      start: python -m uvicorn main:app --host 0.0.0.0 --port 8000
